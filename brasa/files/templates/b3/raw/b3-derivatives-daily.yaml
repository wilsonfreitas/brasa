# Migrated from legacy template templates/legacy/BD_Arbit.yaml
# B3/BM&F derivatives daily bulletin (BD_Arbit.txt), fixed-width, 523 chars/record.
# Downloader intentionally omitted — no known download URL for this bulletin.
id: b3-derivatives-daily
description: Mercado de Derivativos - Negócios Realizados em Pregão

# Local archive of historical daily bulletins (ContratosPregaoFinal), one zip
# per business day, filename pattern BF<yy><mm><dd>.ex_ containing BD_Final.txt.
# NOTE: this fixed-width layout (523 chars/record, same as fields: below) only
# covers files from 2002-06-03 onward. Earlier files use shorter, incompatible
# record layouts (423 chars up to 2000-06-02, 434/479 chars through 2002-06-02)
# and would need separate field definitions if ever needed.
# `path:` below assumes the archive lives at <repo-root>/tmp/ContratosPregaoFinal
# (relative to the working directory brasa is run from) and is a per-user local
# convenience default — override per call with `path=`/`--path` if the archive
# lives elsewhere, e.g.:
#   import_marketdata("b3-derivatives-daily", path="/archive/BF%y%m%d.ex_/BD_Final.txt", refdate=...)
importer:
  path: tmp/ContratosPregaoFinal/BF%y%m%d/BD_Final.txt
  format: txt
  args:
    refdate: ~

reader:
  encoding: latin1
  locale: en
  pipeline:
    - step: read_fwf
      dtype: str
    - step: apply_fields
      errors: coerce
    # Apply per-row dynamic decimals and +/- sign columns to the price/quote fields.
    # read_fwf derives column positions from every field width, and the writer
    # builds its parquet schema from the full `fields:` list, so the sign and
    # decimal-count columns must stay in the output (they are folded into their
    # target numeric fields below but kept as vestigial raw columns, not dropped).
    - step: exec_code
      code: |
        d2 = data["num_casas_decimais_2"].astype("float64")
        d1 = data["num_casas_decimais"].astype("float64")

        star_fields = [
            "preco_exercicio", "cot_ult_oferta_compra", "cot_ult_oferta_venda",
            "cot_primeiro_negocio", "cot_menor_negocio", "cot_maior_negocio",
            "cot_med_negocios", "cot_ult_negocio", "cot_ult_negocio_anterior",
            "cot_fechamento", "limite_min_negociacao", "limite_max_negociacao",
        ]
        for col in star_fields:
            data[col] = data[col].astype("float64") / (10.0 ** d2)

        for col in ("cot_ajuste", "cot_ajuste_anterior"):
            data[col] = data[col].astype("float64") / (10.0 ** d1)

        # valor_diferenca's decimal scale is ambiguous (Obs.1: depends on market
        # type, fut vs. demais), so it is left in raw integer-valued units; only
        # its sign is applied here (still float64 to match the other signed
        # numeric fields and avoid a nullable-Int64 negation edge case).
        data["valor_diferenca"] = data["valor_diferenca"].astype("float64")

        sign_map = {
            "cot_ult_oferta_compra": "sinal_ult_oferta_compra",
            "cot_ult_oferta_venda": "sinal_ult_oferta_venda",
            "cot_primeiro_negocio": "sinal_cot_primeiro_negocio",
            "cot_menor_negocio": "sinal_cot_menor_negocio",
            "cot_maior_negocio": "sinal_cot_maior_negocio",
            "cot_med_negocios": "sinal_cot_med_negocios",
            "cot_ult_negocio": "sinal_cot_ult_negocio",
            "cot_ult_negocio_anterior": "sinal_cot_ult_negocio_anterior",
            "cot_fechamento": "sinal_cot_fechamento",
            "cot_ajuste": "sinal_cot_ajuste",
            "cot_ajuste_anterior": "sinal_cot_ajuste_anterior",
            "perc_oscilacao": "sinal_oscilacao",
            "limite_min_negociacao": "sinal_limite_min_negociacao",
            "limite_max_negociacao": "sinal_limite_max_negociacao",
            "valor_diferenca": "sinal_diferenca",
        }
        for target, sign_col in sign_map.items():
            negative = data[sign_col].astype("string").str.strip().eq("-").fillna(False)
            data.loc[negative, target] = -data.loc[negative, target].astype("float64")

        result = data

writer:
  layer: input
  partitioning: [data_geracao_arquivo]

fields:
  - name: id_transacao
    description: "Identificação da transação"
    type: integer
    width: 6
  - name: compl_transacao
    description: "Complemento da transação (fixo 001)"
    type: integer
    width: 3
  - name: tipo_registro
    description: "Tipo de registro (fixo 01)"
    type: integer
    width: 2
  - name: data_geracao_arquivo
    description: "Data de geração do arquivo"
    type: date(format='%Y%m%d')
    width: 8
  - name: tipo_negociacao
    description: "Tipo de negociação (PR = pregão)"
    type: character
    width: 2
  - name: cod_mercadoria
    description: "Código da mercadoria"
    type: character
    width: 3
  - name: cod_mercado
    description: "Código do mercado"
    type: character
    width: 1
  - name: tipo_serie
    description: "Tipo da série: C (opç. compra), V (opç. venda) ou * (fut)"
    type: character
    width: 1
  - name: serie
    description: "Série (opç) / vencimento (fut)"
    type: character
    width: 4
  - name: hora_criacao_registro
