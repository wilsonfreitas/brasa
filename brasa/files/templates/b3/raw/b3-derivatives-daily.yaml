    width: 8
  - name: preco_exercicio
    description: "Preço de exercício (opç)"
    # dynamic decimals (num_casas_decimais_2) + sign applied in exec_code step
    type: numeric
    width: 13
  - name: tamanho_contr
    description: "Valor do ponto ou tamanho do contrato"
    type: numeric(dec=7.0)
    width: 13
  - name: volume_real
    description: "Volume do dia em R$"
    type: integer
    width: 13
  - name: volume_dolar
    description: "Volume do dia em US$"
    type: integer
    width: 13
  - name: qtd_contr_aberto
