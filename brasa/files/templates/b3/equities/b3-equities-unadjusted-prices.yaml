id: b3-equities-unadjusted-prices
description: Preços não ajustados (OHLC + volume) das ações da B3

etl:
  pipeline:
    - step: sql_query
      datasets:
        - input.b3-bvbg086
        - staging.b3-cotahist
        - input.b3-bdin-stocks-summary
        - staging.b3-equities-spot-market
        - input.b3-bvbg028-equities
      query: |+
        -- Unadjusted OHLC+volume for the spot-market universe.
        -- bvbg086 is the base (starts 2016-02-01) with two whole-market
        -- zero-row days patched from other sources:
        --   2021-06-10 from cotahist; 2016-02-29 from BDIN (cod_bdi=2,
        --   round lot — same source b3-equities-returns uses for that day).
        -- BDIN is never used beyond that single day: its feed ends 2017-06-14.
        -- Pre-2016 history comes from cotahist (starts 2000-01-03; WIL-129).
        -- Cotahist/BDIN branches join on symbol AND isin to guard against
        -- ticker reuse across decades (drops 2,649 rows of reused tickers:
        -- pre-2006 BBAS11/BBAS12/KLBN11 receipts, FIXX11/EAGL11 fund
        -- re-registrations). No bdi_code filter on cotahist: universe symbols
        -- span several bdi codes (2 round lot, 12 FII, 14 ETF, ...) with
        -- zero (symbol, refdate) duplicates at instrument_market = 10.
        -- The bvbg086 base joins by symbol only (same era as the universe);
        -- universe_symbols keeps it duplicate-free if a symbol ever maps to
        -- more than one isin in the register.
        -- distribution_id (WIL-136): cotahist and BDIN branches carry it
        -- natively; the bvbg086 base left-joins the bvbg028 register deduped
        -- by max(distribution_id) — around corporate events B3 lists the old
        -- and new distribution on the same day and max() picks the trading
        -- one (validated vs cotahist 2024: 3 mismatches in 638k pairs).
        -- Nulls only on register gap days: 2022-04-26, 2023-12-08 (whole
        -- market) and 2021-06-11 (one symbol).
        with universe as (
          select distinct symbol, isin from 'staging.b3-equities-spot-market'
        ),
        universe_symbols as (
          select distinct symbol from universe
        ),
        register_dist as (
          select refdate, symbol, max(distribution_id) as distribution_id
          from 'input.b3-bvbg028-equities'
          where instrument_market = 10 and instrument_segment = 1
            and instrument_asset <> 'TAXA'
            and security_category in (1, 11, 6, 21, 3, 13)
          group by refdate, symbol
        )
        select
          q.refdate, q.symbol,
          q.traded_quantity as trade_quantity,
          q.traded_contracts, q.volume,
          q.open, q.low, q.high, q.close, q.average,
          rd.distribution_id
        from 'input.b3-bvbg086' q
        join universe_symbols u on u.symbol = q.symbol
        left join register_dist rd
          on rd.refdate = q.refdate and rd.symbol = q.symbol

        union all

        select
          c.refdate, c.symbol,
          c.trade_quantity, c.traded_contracts, c.volume,
          c.open, c.low, c.high, c.close, c.average,
          c.distribution_id
        from 'staging.b3-cotahist' c
        join universe u on u.symbol = c.symbol and u.isin = c.isin
        where c.refdate = '2021-06-10'

        union all

        select
          cast(b.refdate as date) as refdate,
          b.cod_negociacao as symbol,
          b.qtd_negocios as trade_quantity,
          b.qtd_titulos_negociados as traded_contracts,
          b.volume_titulos_negociados as volume,
          b.preco_abertura as open,
          b.preco_min as low,
          b.preco_max as high,
          b.preco_ult as close,
          b.preco_med as average,
          cast(b.num_dist as integer) as distribution_id
        from 'input.b3-bdin-stocks-summary' b
        join universe u on u.symbol = b.cod_negociacao and u.isin = b.cod_isin
        where b.refdate = '2016-02-29' and b.cod_bdi = 2

        union all

        select
          c.refdate, c.symbol,
          c.trade_quantity, c.traded_contracts, c.volume,
          c.open, c.low, c.high, c.close, c.average,
          c.distribution_id
        from 'staging.b3-cotahist' c
        join universe u on u.symbol = c.symbol and u.isin = c.isin
        where c.refdate < date '2016-02-01' and c.instrument_market = 10

        order by refdate, symbol

    - step: apply_fields

writer:
  layer: staging
  partitioning: []

fields:
  - name: refdate
    description: Reference date
    type: date
  - name: symbol
    description: Equity symbol
    type: string
  - name: trade_quantity
    description: Number of trades in the session
    type: numeric
  - name: traded_contracts
    description: Quantity of securities traded
    type: numeric
  - name: volume
    description: Financial volume traded
    type: numeric
  - name: open
    description: Opening price (unadjusted)
    type: numeric
  - name: low
    description: Lowest price (unadjusted)
    type: numeric
  - name: high
    description: Highest price (unadjusted)
    type: numeric
  - name: close
    description: Closing price (unadjusted)
    type: numeric
  - name: average
    description: Average price (unadjusted)
    type: numeric
  - name: distribution_id
    description: Distribution number of the security (register)
    type: integer
