id: b3-futures-ddi-first-generic
description: Primeiro Futuro de Cupom Cambial (DDIT01)

etl:
  pipeline:
    # The legacy business_days_to_ignore=[0, 1] rule = pick the nearest
    # contract with at least 2 business days to maturity. days_to_settlement
    # is null in staging.b3-futures, so business days are computed with the
    # bizdays step (ANBIMA calendar: reaches 2099; the B3 calendar in the
    # installed bizdays package ends in 2026, before the longest maturities).
    - step: sql_query
      datasets:
        - staging.b3-futures
      query: |+
        -- All DDI contracts still alive on each refdate; the front pick
        -- happens after the bizdays step. Rates published in percent are
        -- stored in decimal form (project convention).
        select
          refdate,
          'DDIT01' as symbol,
          symbol as ref,
          maturity_date,
          adjusted_quote,
          adjusted_tax
        from 'staging.b3-futures'
        where
          commodity = 'DDI'
          and maturity_date > refdate
        order by refdate, maturity_date

    - step: bizdays
      from_column: refdate
      to_column: maturity_date
      output_column: business_days
      calendar: ANBIMA

    - step: filter_rows
      column: business_days
      operator: ge
      value: 2

    - step: sort
      by: [refdate, maturity_date]

    - step: drop_duplicates
      subset: [refdate]
      keep: first

    - step: select_fields
    - step: apply_fields
      errors: coerce

writer:
  layer: staging
  partitioning: []

fields:
  - name: refdate
    description: Reference date
    type: date
  - name: symbol
    description: Continuous front-contract symbol (constant DDIT01)
    type: string
  - name: ref
    description: Original contract ticker backing the generic on this date
    type: string
  - name: maturity_date
    description: Maturity date of the backing contract
    type: date
  - name: adjusted_quote
    description: Settlement quote of the backing contract
    type: numeric
  - name: adjusted_tax
    description: Published settlement rate of the backing contract, decimal form
    type: numeric
