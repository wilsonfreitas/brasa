id: brasa-returns
description: Todos os retornos (formato longo)

etl:
  pipeline:
    - step: sql_query
      datasets:
        - staging.b3-equities-returns
        - staging.b3-indexes-returns
        - staging.b3-equities-etfs-returns
        - staging.b3-equities-returns-symbols-changes
        - staging.b3-curves-di1-standard-returns
        - staging.b3-curves-dap-standard-returns
        - staging.bcb-currencies-returns
        - staging.b3-futures-win-adjusted-returns
        - staging.b3-futures-wdo-adjusted-returns
      query: |+
        -- Long-format union of canonical log-return series. Dropped from
        -- the legacy list: brasa-returns-missing-data (dead source).
        select refdate, symbol, log_return as returns
        from 'staging.b3-equities-returns'
        union all
        select refdate, symbol, log_return as returns
        from 'staging.b3-indexes-returns'
        union all
        select refdate, symbol, log_return as returns
        from 'staging.b3-equities-etfs-returns'
        union all
        select refdate, symbol, log_return as returns
        from 'staging.b3-equities-returns-symbols-changes'
        union all
        select refdate, symbol, returns
        from 'staging.b3-curves-di1-standard-returns'
        union all
        select refdate, symbol, returns
        from 'staging.b3-curves-dap-standard-returns'
        union all
        select refdate, symbol, log_return as returns
        from 'staging.bcb-currencies-returns'
        union all
        select refdate, symbol, log_return as returns
        from 'staging.b3-futures-win-adjusted-returns'
        union all
        select refdate, symbol, log_return as returns
        from 'staging.b3-futures-wdo-adjusted-returns'
        order by refdate, symbol

    - step: apply_fields

writer:
  layer: staging
  partitioning: []

fields:
  - name: refdate
    description: Reference date
    type: date
  - name: symbol
    description: Instrument symbol (namespaced by source convention)
    type: string
  - name: returns
    description: Daily log return
    type: numeric
