# Declarative data-validation rules consumed by `brasa doctor`
# (category: validations). Keyed by "layer.dataset".
#
# Rule: calendar-completeness — verify each listed series has a row for every
# business day of the given bizdays calendar across its observed range.

staging.bcb-sgs:
  - rule: calendar-completeness
    date_column: refdate
    group_column: symbol
    series:
      CDI: { calendar: ANBIMA }
      SELIC: { calendar: ANBIMA }
      SETA: { calendar: ANBIMA }
      # IPCA / IGPM are monthly — deferred to v2 (see WIL-85).

staging.bcb-currency:
  - rule: calendar-completeness
    date_column: refdate
    group_column: symbol
    series:
      USD: { calendar: ANBIMA }
      EUR: { calendar: ANBIMA }
      JPY: { calendar: ANBIMA }
      GBP: { calendar: ANBIMA }

staging.b3-indexes-historical-prices:
  - rule: calendar-completeness
    date_column: refdate
    group_column: symbol
    series:
      IBOV: { calendar: B3 }
      IFIX: { calendar: B3 }
      SMLL: { calendar: B3 }
      ICON: { calendar: B3 }
      IDIV: { calendar: B3 }

staging.b3-cotahist:
