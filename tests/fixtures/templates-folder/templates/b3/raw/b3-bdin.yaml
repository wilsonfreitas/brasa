# Migrated from legacy template templates/b3/raw/legacy/BDIN.yaml
# B3/BOVESPA daily bulletin BDIN (multi-record FWF, 350-byte records).
# Layout: tmp/layout_BDIN_v11_BOVESPA.pdf. Nine data record types (00-08) plus
# trailer (99); each is emitted as its own dataset. The pregao date from the
# header (record 00) is injected as refdate into every dataset for partitioning.
# Downloader/importer intentionally omitted - to be added later.
id: b3-bdin
description: Boletim Diario BOVESPA (BDIN) - Cotacoes do Pregao de Acoes

importer:
  path: tmp/%Y/bdi%m%d.zip
  format: zip
  args:
    refdate: ~

reader:
  encoding: latin1
  locale: en
  pipeline:
    - step: b3_read_bdin_fwf
    - step: apply_fields_multi

writer:
  layer: input
  partitioning: [refdate]

datasets:
  indexes-summary:
    tag: '01'
    fields:
      - name: tipo_registro
        description: "Tipo de registro"
        type: character
        width: 2
      - name: id_indice
        description: "Identificação do índice"
        type: numeric(dec=0.0)
        width: 2
      - name: nome_indice
        description: "Nome do índice"
        type: character
        width: 30
