id: b3-futures-ind-first-generic
description: Primeiro Futuro de Índice (INDT01)

etl:
  pipeline:
    - step: sql_query
      datasets:
        - staging.b3-futures
      query: |+
        -- Front IND contract per refdate. The maturity_date > refdate filter
        -- encodes the legacy business_days_to_ignore=[0] rule: on the maturity
        -- day the front contract is skipped and the 2nd contract is taken.
        select
          refdate,
          'INDT01' as symbol,
          symbol as ref,
          maturity_date,
          adjusted_quote
        from (
          select
            *,
            row_number() over (
              partition by refdate order by maturity_date
            ) as rn
          from 'staging.b3-futures'
          where
            commodity = 'IND'
            and maturity_date > refdate
        )
        where rn = 1
        order by refdate

    - step: select_fields
    - step: apply_fields

writer:
  layer: staging
  partitioning: []

fields:
  - name: refdate
    description: Reference date
    type: date
  - name: symbol
    description: Continuous front-contract symbol (constant INDT01)
    type: string
  - name: ref
    description: Original contract ticker backing the generic on this date
    type: string
  - name: maturity_date
    description: Maturity date of the backing contract
    type: date
  - name: adjusted_quote
    description: Settlement quote of the backing contract
    type: numeric
