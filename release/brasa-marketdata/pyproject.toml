# The last brasa-marketdata release: no code, it only installs brasa-core.
# Build: uv build release/brasa-marketdata --out-dir dist/
[project]
name = "brasa-marketdata"
version = "0.5.0"
description = "Renamed to brasa-core: this package only installs brasa-core."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "wilsonfreitas", email = "wilson.freitas@gmail.com" }]
dependencies = ["brasa-core>=0.5"]

[project.urls]
Homepage = "https://github.com/wilsonfreitas/brasa"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
