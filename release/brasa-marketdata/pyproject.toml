# The last brasa-marketdata release: a stub that refuses to install and says
# how to switch to brasa-core. Upload only the sdist:
#   uv build --sdist release/brasa-marketdata --out-dir dist/
# Why not a package that depends on brasa-core: both own the `brasa/` files, so
# `pip install -U brasa-marketdata` installs brasa-core first and then deletes
# its files while removing 0.4.0 (tested 2026-11-01, WIL-205). A failed build
# leaves 0.4.0 untouched.
[project]
name = "brasa-marketdata"
version = "0.5.0"
description = "Renamed to brasa-core: pip uninstall brasa-marketdata && pip install brasa-core"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "wilsonfreitas", email = "wilson.freitas@gmail.com" }]

[project.urls]
Homepage = "https://github.com/wilsonfreitas/brasa"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["/README.md", "/pyproject.toml", "/hatch_build.py"]

# Building a wheel (what pip and uv do when installing the sdist) always fails.
[tool.hatch.build.targets.wheel.hooks.custom]
